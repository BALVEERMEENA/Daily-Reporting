name: Deploy to Firebase

# Deploys the Firestore security rules and the web/ frontend to Firebase
# whenever main changes. You can also run it by hand from the Actions tab
# (Run workflow). Requires one repository secret: FIREBASE_SERVICE_ACCOUNT
# (the full JSON key of a Firebase service account). The target project is
# set below via PROJECT_ID (and also lives in .firebaserc).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Deploy Firestore rules and Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,hosting --non-interactive
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: dr2785
