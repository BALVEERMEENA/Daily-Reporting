<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daily Reporting</title>
  <meta name="description" content="Daily employee reporting — questionnaires, tasks and reports." />
  <link rel="stylesheet" href="styles.css" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
  <!-- iOS "Add to Home Screen" -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Reporting" />
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="app.js"></script>
  <script>
    // Always load the freshest deploy: never cache the SW script, check for a
    // new version on every open and whenever the tab regains focus, and reload
    // automatically the moment a new version takes over.
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing || !hadController) return; // skip the very first install
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .then(function (reg) {
            reg.update();
            setInterval(function () { reg.update(); }, 60000);
          })
          .catch(function () {});
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }).catch(function () {});
        }
      });
    }
  </script>
</body>
</html>
