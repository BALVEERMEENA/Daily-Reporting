<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daily Reporting</title>
  <meta name="description" content="Daily employee reporting — questionnaires, tasks and reports." />
  <link rel="stylesheet" href="styles.css" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#9e1b32" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
  <!-- iOS "Add to Home Screen" -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Reporting" />
</head>
<body>
  <div id="root">
    <!-- Shown until the app boots; replaced by the app, or by the error below
         if the app scripts can't load (e.g. a network/CDN block). -->
    <div id="boot-status" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#334155;padding:24px;text-align:center">
      <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#ffb24d,#ef6c00);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff">☀</div>
      <div id="boot-msg">Loading Daily Reporting…</div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script>
    // If the app hasn't started shortly after load, the scripts likely could
    // not be fetched — show a clear message instead of a blank page.
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (window.__APP_BOOTED) return;
        var s = document.getElementById('boot-status');
        var m = document.getElementById('boot-msg');
        if (!s || !m) return;
        m.innerHTML = 'Couldn’t load the app.<br><span style="color:#6b7280;font-size:14px;display:inline-block;margin-top:8px">Please check your internet connection and try again.<br>If you are on an office / bank network, it may be blocking required resources.</span>';
        var btn = document.createElement('button');
        btn.textContent = '↻ Reload';
        btn.style.cssText = 'padding:10px 18px;border:none;border-radius:8px;background:#ef6c00;color:#fff;font-weight:600;cursor:pointer';
        btn.onclick = function () { location.reload(); };
        s.appendChild(btn);
      }, 9000);
    });
  </script>
  <script type="module" src="app.js"></script>
  <script>
    // Always load the freshest deploy: never cache the SW script, check for a
    // new version on every open and whenever the tab regains focus, and reload
    // automatically the moment a new version takes over.
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing || !hadController) return; // skip the very first install
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .then(function (reg) {
            reg.update();
            setInterval(function () { reg.update(); }, 60000);
          })
          .catch(function () {});
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }).catch(function () {});
        }
      });
    }
  </script>
</body>
</html>
