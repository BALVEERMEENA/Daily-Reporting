plugins {
    id 'com.android.application'
}

android {
    namespace 'app.web.dr2785.twa'
    compileSdk 34

    defaultConfig {
        applicationId 'app.web.dr2785.twa'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Stable signing key so the app's SHA-256 never changes — this is what the
    // site's /.well-known/assetlinks.json trusts, letting the TWA run
    // full-screen (no URL bar). Non-sensitive: it only proves this app may open
    // this site; the site's real security is Firebase Auth + rules.
    signingConfigs {
        twa {
            storeFile file('twa-signing.keystore')
            storePassword 'dailyreporting'
            keyAlias 'dr'
            keyPassword 'dailyreporting'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.twa
        }
        release {
            signingConfig signingConfigs.twa
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity helper: wraps the deployed PWA as a native app.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
